[project]
name = "twinme-recon"
version = "0.1.0"
description = "TwinMe HD Twin reconstruction worker: multi-view FLAME fitting, texture baking, GLB export."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "av>=13.0",
  "mediapipe>=0.10.18",
  "trimesh>=4.4",
  "scipy>=1.14",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
]

[project.optional-dependencies]
# GPU stage (installed in the CUDA image; see Dockerfile)
gpu = ["torch>=2.4", "pytorch3d>=0.7.8"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["twinme_recon*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
